name = "tree-calculus"
defaultTargets = ["TreeCalculus", "Cpp", "Rules"]

[[lean_lib]]
name = "TreeCalculus"
# TreeCalculus.lean and every module under TreeCalculus/, imported or not.
globs = ["TreeCalculus.*"]

[[lean_lib]]
name = "Cpp"

# Rules derived from library trees by Rules/gen-rules.mjs, each checked by `decide +kernel`.
[[lean_lib]]
name = "Rules"

# The benchmark's executable (benchmark/run-one.sh); not a default target, so
# `lake build` still means the formalization.
[[lean_exe]]
name = "tree-calculus"
root = "Main"
